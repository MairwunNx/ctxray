name: CI

on:
  push:
  pull_request:
  # The autopilot dispatches CI after its own commit: pushes made with GITHUB_TOKEN start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so the CI run the autopilot dispatches never cancels the run that called it.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: File size
        run: bun scripts/check-file-size.ts
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      # Ink only runs in a terminal outside CI, so the second check fakes both.
      - name: Smoke test the binary
        run: |
          ./dist/ctxray --version
          script -qec "env -u CI -u GITHUB_ACTIONS ./dist/ctxray --help" /dev/null | tee help.log
          grep -qF $'\e[?2026h' help.log
      # The config init writes imports @mairwunnx/ctxray. Outside the repository only the binary can serve it.
      - name: Smoke test the config
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/dist/ctxray" init
          "$GITHUB_WORKSPACE/dist/ctxray" config | tee config.log
          grep -qF '"claude-code": {}' config.log
      # Test files import @mairwunnx/ctxray, and the binary serves its own API over whatever node_modules holds
      # (ADR 0001). build.module with loader "object" isn't documented, so a Bun upgrade breaks it here first.
      - name: Smoke test the runner
        run: |
          dir="$(mktemp -d)"
          cp -R packages/ctxray/fixtures/runner/. "$dir"
          cp -R packages/ctxray/fixtures/static/payments "$dir/payments"
          stale="$dir/node_modules/@mairwunnx/ctxray"
          mkdir -p "$stale"
          echo '{"name":"@mairwunnx/ctxray","version":"0.0.1","type":"module","exports":"./index.js"}' > "$stale/package.json"
          echo 'throw new Error("the project copy ran instead of the binary");' > "$stale/index.js"
          cd "$dir"
          git init -q
          "$GITHUB_WORKSPACE/dist/ctxray" test | tee test.log
          grep -qF "L3 ✓ 6" test.log
          grep -qF "@mairwunnx/ctxray 0.0.1" test.log
      # The capture fixture pins the harnesses in its ctxray.lock. The binary installs them from npm into its
      # cache, and the next run takes them from the cache that actions/cache restores.
      - name: Locate the harness cache
        id: harness-cache
        run: echo "dir=$(./dist/ctxray cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.harness-cache.outputs.dir }}
          key: ctxray-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/ctxray/fixtures/capture/ctxray.lock') }}
      - name: Install the harnesses
        working-directory: packages/ctxray/fixtures/capture
        run: $GITHUB_WORKSPACE/dist/ctxray harness install
      # The plugin and the marketplace, checked by the Claude Code the capture fixture pins, in a HOME of its own.
      - name: Check the Claude Code plugin
        run: |
          claude="$(find "${{ steps.harness-cache.outputs.dir }}/harnesses/claude-code" -name claude -type f | head -1)"
          export HOME="$(mktemp -d)"
          "$claude" plugin validate --strict packages/claude-plugin
          "$claude" plugin test packages/claude-plugin
          "$claude" plugin validate --strict .
          bun scripts/plugin-zip.ts
      # L4 and L5: the binary launches every harness from its cache on the mock model, with their MCP servers
      # behind its shim. CI makes the run frozen: it needs the lockfile and never installs past it.
      - name: Smoke test capture
        run: |
          dir="$(mktemp -d)"
          cp -R packages/ctxray/fixtures/capture/. "$dir"
          cd "$dir"
          git init -q
          "$GITHUB_WORKSPACE/dist/ctxray" test | tee test.log
          grep -qF "L4 ✓ 15" test.log
          grep -qF "L5 ✓ 10" test.log
          # L6: Claude's answers to the refund prompt, recorded once with --backend real --record, replayed for free.
          "$GITHUB_WORKSPACE/dist/ctxray" test --layer L6 --harness claude-code --backend replay --reporter console | tee replay.log
          grep -qF "L6 ✓ 1" replay.log
          # CI writes every report: JUnit for the test view, the HTML page for the artifact below.
          test -s .ctxray/report/junit.xml
          test -s .ctxray/report/report.json
          grep -qF '<script id="ctxray-report"' .ctxray/report/index.html
          mv .ctxray/report "$GITHUB_WORKSPACE/capture-report"
      - name: Keep the capture report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-report
          path: capture-report
          if-no-files-found: ignore

  # Biome failed: Claude fixes what Biome reports and commits to the same branch, once.
  autopilot:
    needs: biome
    if: >-
      always() && needs.biome.result == 'failure' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/autopilot-biome.yml
    with:
      branch: ${{ github.head_ref || github.ref_name }}
    secrets: inherit
    permissions:
      contents: write
      actions: write
