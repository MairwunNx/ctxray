name: Release packages

# Publishes a built release to npm and ghcr.io. Release calls it for the latest channel, Next for next.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        description: latest (npm latest, images :<version> and :latest) or next (npm next, image :edge)
        type: string
        required: true
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mairwunnx/ctxray

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist/release
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then set -- --dry-run; fi
          bun scripts/release/publish-npm.ts --tag "$CHANNEL" "$@"

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release
      - id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ inputs.channel }}" = latest ]; then
            echo "slim=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "runtime=$IMAGE:$VERSION-runtime,$IMAGE:runtime" >> "$GITHUB_OUTPUT"
          else
            echo "slim=$IMAGE:edge" >> "$GITHUB_OUTPUT"
            echo "runtime=$IMAGE:edge-runtime" >> "$GITHUB_OUTPUT"
          fi
      # The runtime image installs git with apt on arm64 too.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.dry-run == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: release/docker
          target: slim
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry-run == false }}
          tags: ${{ steps.tags.outputs.slim }}
          labels: org.opencontainers.image.source=https://github.com/MairwunNx/ctxray
      - uses: docker/build-push-action@v7
        with:
          context: release/docker
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry-run == false }}
          tags: ${{ steps.tags.outputs.runtime }}
          labels: org.opencontainers.image.source=https://github.com/MairwunNx/ctxray
