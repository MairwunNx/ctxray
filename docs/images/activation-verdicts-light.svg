<text x="366.986301369863" y="407" font-size="12" fill="#1f2328" font-weight="600">35 runs</text>
<text x="24" y="433" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">min 0.95</text>
