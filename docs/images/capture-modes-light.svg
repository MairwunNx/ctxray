<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Three capture modes</title>
<desc>static reads your files and predicts the Loadout. capture launches the harness and records its requests. observe records your own sessions, through the harness’s hooks or the record it keeps.</desc>
<defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8250df"/></marker></defs>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0969da"/></marker></defs>
<defs><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1a7f37"/></marker></defs>
<rect x="24" y="16" width="282" height="378" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1"/>
<rect x="40" y="32" width="63" height="24" rx="6" fill="#1a7f37"/>
<text x="71.5" y="48.68" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">static</text>
<text x="40" y="82" font-size="14" fill="#1f2328" font-weight="600">Reads your files and predicts</text>
<rect x="40" y="100" width="250" height="40" rx="6" fill="#dafbe1" stroke="#d1d9e0" stroke-width="1"/>
<text x="165.0" y="124" font-size="12" fill="#1f2328" text-anchor="middle">Your project’s files</text>
<path d="M165.0 142 L165.0 158" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#m-green)"/>
<rect x="40" y="160" width="250" height="40" rx="6" fill="#dafbe1" stroke="#d1d9e0" stroke-width="1"/>
<text x="165.0" y="184" font-size="12" fill="#1f2328" text-anchor="middle">ctxray follows the harness’s rules</text>
<path d="M165.0 202 L165.0 218" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#m-green)"/>
<rect x="40" y="220" width="250" height="40" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="165.0" y="244" font-size="12" fill="#1f2328" text-anchor="middle">A predicted Loadout</text>
<text x="40" y="290" font-size="11" fill="#59636e" font-weight="600">Where</text>
<text x="40" y="308" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">inspect, diff, L1–L3</text>
<text x="40" y="338" font-size="11" fill="#59636e" font-weight="600">Sees</text>
<text x="40" y="356" font-size="12" fill="#1f2328">Files only: the system prompt and tool</text>
<text x="40" y="373" font-size="12" fill="#1f2328">schemas stay unknown</text>
<rect x="319" y="16" width="282" height="378" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1"/>
<rect x="335" y="32" width="71" height="24" rx="6" fill="#0969da"/>
<text x="370.5" y="48.68" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">capture</text>
<text x="335" y="82" font-size="14" fill="#1f2328" font-weight="600">Launches the harness and records it</text>
<rect x="335" y="100" width="250" height="40" rx="6" fill="#ddf4ff" stroke="#d1d9e0" stroke-width="1"/>
<text x="460.0" y="124" font-size="12" fill="#1f2328" text-anchor="middle">A copy of the project</text>
<path d="M460.0 142 L460.0 158" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<rect x="335" y="160" width="250" height="40" rx="6" fill="#ddf4ff" stroke="#d1d9e0" stroke-width="1"/>
<text x="460.0" y="184" font-size="12" fill="#1f2328" text-anchor="middle">The harness talks to ctxray’s proxy</text>
<path d="M460.0 202 L460.0 218" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<rect x="335" y="220" width="250" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="460.0" y="244" font-size="12" fill="#1f2328" text-anchor="middle">The request the model got</text>
<text x="335" y="290" font-size="11" fill="#59636e" font-weight="600">Where</text>
<text x="335" y="308" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">L4–L7, harness upgrade</text>
<text x="335" y="338" font-size="11" fill="#59636e" font-weight="600">Sees</text>
<text x="335" y="356" font-size="12" fill="#1f2328">The whole request: system prompt, tools,</text>
<text x="335" y="373" font-size="12" fill="#1f2328">MCP schemas</text>
<rect x="614" y="16" width="282" height="378" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="1"/>
<rect x="630" y="32" width="71" height="24" rx="6" fill="#8250df"/>
<text x="665.5" y="48.68" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">observe</text>
<text x="630" y="82" font-size="14" fill="#1f2328" font-weight="600">Records the sessions you run</text>
<rect x="630" y="100" width="250" height="40" rx="6" fill="#fbefff" stroke="#d1d9e0" stroke-width="1"/>
<text x="755.0" y="124" font-size="12" fill="#1f2328" text-anchor="middle">A session you ran yourself</text>
<path d="M755.0 142 L755.0 158" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#m-purple)"/>
<rect x="630" y="160" width="250" height="40" rx="6" fill="#fbefff" stroke="#d1d9e0" stroke-width="1"/>
<text x="755.0" y="184" font-size="12" fill="#1f2328" text-anchor="middle">Hooks, or the harness’s own record</text>
<path d="M755.0 202 L755.0 218" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#m-purple)"/>
<rect x="630" y="220" width="250" height="40" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1"/>
<text x="755.0" y="244" font-size="12" fill="#1f2328" text-anchor="middle">What the session loaded</text>
<text x="630" y="290" font-size="11" fill="#59636e" font-weight="600">Where</text>
<text x="630" y="308" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">spectate, the /ctxray plugin</text>
<text x="630" y="338" font-size="11" fill="#59636e" font-weight="600">Sees</text>
<text x="630" y="356" font-size="12" fill="#1f2328">What the harness reports or records, the</text>
<text x="630" y="373" font-size="12" fill="#1f2328">whole request with --session in Claude Code</text>
</svg>
