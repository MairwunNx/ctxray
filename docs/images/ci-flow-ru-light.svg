<svg xmlns="http://www.w3.org/2000/svg" width="920" height="406" viewBox="0 0 920 406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>ctxray в CI</title>
<desc>Каждый push запускает ctxray test, слои L1–L5 на mock-модели. Pull request проигрывает записанные ответы для L6 и L7 и сравнивает контекст с базовой веткой. Ответы записываются один раз на настоящей модели и коммитятся. Еженедельная задача гоняет L6 на настоящей модели с бюджетом. Каждая задача пишет отчёты и сводку.</desc>
<defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8250df"/></marker></defs>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0969da"/></marker></defs>
<rect x="24" y="16" width="170" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="40" y="46" font-size="13" fill="#1f2328" font-weight="600">Каждый push</text>
<path d="M196 51.0 L216 51.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<rect x="220" y="16" width="400" height="70" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="236" y="44" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">ctxray test</text>
<text x="236" y="66" font-size="12" fill="#59636e">L1–L5 на mock-модели, бесплатно, без ключа</text>
<path d="M622 51.0 L650 51.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<rect x="24" y="100" width="170" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="40" y="130" font-size="13" fill="#1f2328" font-weight="600">Pull request</text>
<path d="M196 135.0 L216 135.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<rect x="220" y="100" width="400" height="70" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="236" y="128" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">ctxray test --backend replay --base origin/main</text>
<text x="236" y="150" font-size="12" fill="#59636e">L6–L7 из кассет и то, как изменение поменяло контекст</text>
<path d="M622 135.0 L650 135.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<rect x="24" y="184" width="170" height="70" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1" stroke-dasharray="5 4"/>
<text x="40" y="214" font-size="13" fill="#1f2328" font-weight="600">Один раз, у вас</text>
<path d="M196 219.0 L216 219.0" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#m-purple)"/>
<rect x="220" y="184" width="400" height="70" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="236" y="212" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">ctxray test --backend real --record</text>
<text x="236" y="234" font-size="12" fill="#59636e">закоммитьте __cassettes__/ рядом с тестами</text>
<rect x="24" y="268" width="170" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="40" y="298" font-size="13" fill="#1f2328" font-weight="600">Раз в неделю</text>
<path d="M196 303.0 L216 303.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<rect x="220" y="268" width="400" height="70" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="236" y="296" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">ctxray test --layer L6 --backend real --budget 5</text>
<text x="236" y="318" font-size="12" fill="#59636e">настоящая модель, ключ из секретов, ограниченные траты</text>
<path d="M622 303.0 L650 303.0" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#m-blue)"/>
<path d="M620 204 h16 V154 h-14" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#m-purple)"/>
<rect x="654" y="16" width="242" height="322" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="670" y="44" font-size="14" fill="#1f2328" font-weight="600">Отчёты</text>
<text x="670" y="72" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">.ctxray/report/</text>
<text x="670" y="91" font-size="12" fill="#59636e">console, JSON, JUnit, Markdown,</text>
<text x="670" y="108" font-size="12" fill="#59636e">HTML</text>
<text x="670" y="133" font-size="12" fill="#59636e">сводка задачи на GitHub</text>
<text x="670" y="158" font-size="12" fill="#59636e">код выхода 1 роняет задачу</text>
<text x="24" y="370" font-size="12" fill="#59636e">ctxray.lock закрепляет сборки харнессов, ключ кеша идёт за ним</text>
</svg>
