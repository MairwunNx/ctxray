<svg xmlns="http://www.w3.org/2000/svg" width="920" height="496" viewBox="0 0 920 496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Which harness supports which layer</title>
<desc>L1 to L3 work for every harness. L4 to L7 launch the harness, so they work for Claude Code, Codex, Gemini CLI, and OpenCode, and for Cursor CLI as an experiment. The editors read the same files as their CLIs. spectate watches your own sessions in Claude Code and Cursor.</desc>
