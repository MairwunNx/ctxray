<text x="266.0" y="77" font-size="11" fill="#9198a1" text-anchor="middle">Lint</text>
<text x="350.0" y="60" font-size="14" fill="#f0f6fc" font-weight="700" text-anchor="middle">L2</text>
<text x="350.0" y="77" font-size="11" fill="#9198a1" text-anchor="middle">Policy</text>
<text x="434.0" y="60" font-size="14" fill="#f0f6fc" font-weight="700" text-anchor="middle">L3</text>
<text x="434.0" y="77" font-size="11" fill="#9198a1" text-anchor="middle">Resolve</text>
<text x="518.0" y="60" font-size="14" fill="#f0f6fc" font-weight="700" text-anchor="middle">L4</text>
<text x="518.0" y="77" font-size="11" fill="#9198a1" text-anchor="middle">Assemble</text>
<text x="602.0" y="60" font-size="14" fill="#f0f6fc" font-weight="700" text-anchor="middle">L5</text>
<text x="602.0" y="77" font-size="11" fill="#9198a1" text-anchor="middle">Wire</text>
<text x="686.0" y="60" font-size="14" fill="#f0f6fc" font-weight="700" text-anchor="middle">L6</text>
<text x="686.0" y="77" font-size="11" fill="#9198a1" text-anchor="middle">Activate</text>
<text x="770.0" y="60" font-size="14" fill="#f0f6fc" font-weight="700" text-anchor="middle">L7</text>
<text x="770.0" y="77" font-size="11" fill="#9198a1" text-anchor="middle">Scenario</text>
<text x="854.0" y="69" font-size="12" fill="#f0f6fc" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">spectate</text>
