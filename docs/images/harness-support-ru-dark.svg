<text x="728.0" y="30" font-size="12" fill="#ab7df8" font-weight="600" text-anchor="middle">Настоящая модель</text>
<rect x="815.0" y="12" width="78.0" height="26" rx="6" fill="#151b23" stroke="#9198a1" stroke-width="1"/>
