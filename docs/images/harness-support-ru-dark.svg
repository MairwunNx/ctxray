<svg xmlns="http://www.w3.org/2000/svg" width="920" height="444" viewBox="0 0 920 444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Какой харнесс поддерживает какой уровень</title>
<desc>L1–L3 работают для всех харнессов. L4–L7 запускают харнесс, поэтому работают для Claude Code, Codex, Gemini CLI и OpenCode, а для Cursor CLI — экспериментально. spectate следит за вашими сессиями: Claude Code и Cursor через их hooks, Codex, Gemini CLI и OpenCode по записям, которые они ведут сами.</desc>
<rect x="227.0" y="12" width="246.0" height="26" rx="6" fill="#12261e" stroke="#3fb950" stroke-width="1"/>
