<text x="864.0" y="289" font-size="10" fill="#d29922" font-weight="700">4</text>
<circle cx="30" cy="334" r="6" fill="#3fb950"/>
<text x="44" y="338" font-size="12" fill="#9198a1">поддерживается</text>
<circle cx="164.08000000000004" cy="334" r="6" fill="none" stroke="#d29922" stroke-width="2"/>
<text x="178.08000000000004" y="338" font-size="12" fill="#9198a1">частично или экспериментально, см. примечание</text>
<text x="487.76" y="338" font-size="13" fill="#3d444d" text-anchor="middle">–</text>
<text x="501.76" y="338" font-size="12" fill="#9198a1">не поддерживается</text>
<text x="24" y="364" font-size="12" fill="#9198a1">1  Экспериментально: нужна локальная сборка Cursor, которая принимает base URL.</text>
<text x="24" y="382" font-size="12" fill="#9198a1">2  Codex не грузит правила по путям, поэтому тесты, которым они нужны, пропускаются.</text>
<text x="24" y="400" font-size="12" fill="#9198a1">3  По записи сессии самого харнесса: без инструментов, а у Gemini CLI и OpenCode ещё и без системного промпта.</text>
<text x="24" y="418" font-size="12" fill="#9198a1">4  Hooks Cursor называют только файлы, которые прочитал агент: что они подтянут, ctxray предсказывает.</text>
