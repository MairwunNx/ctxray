<text x="316" y="70" font-size="14" fill="#1f2328" font-weight="600">Claude Code, Codex,</text>
<text x="316" y="90" font-size="14" fill="#1f2328" font-weight="600">Cursor, Gemini CLI,</text>
<text x="316" y="110" font-size="14" fill="#1f2328" font-weight="600">OpenCode</text>
<text x="316" y="142" font-size="12" fill="#59636e">находит ваши файлы</text>
<text x="316" y="167" font-size="12" fill="#59636e">перечисляет скиллы</text>
<text x="316" y="192" font-size="12" fill="#59636e">запускает MCP-серверы</text>
<text x="316" y="217" font-size="12" fill="#59636e">добавляет свой системный</text>
<text x="316" y="234" font-size="12" fill="#59636e">промпт и инструменты</text>
<path d="M488 64 L526 64" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#m-muted)" stroke-dasharray="5 4"/>
