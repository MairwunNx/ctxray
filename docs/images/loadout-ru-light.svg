<svg xmlns="http://www.w3.org/2000/svg" width="920" height="424" viewBox="0 0 920 424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Из чего состоит Loadout</title>
<desc>Файлы проекта проходят через харнесс, он добавляет свой системный промпт и инструменты, и получается контекст модели: системный промпт, встроенные инструменты, правила, скиллы, MCP-серверы и инструменты, команды.</desc>
<defs><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9a6700"/></marker></defs>
<defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#bc4c00"/></marker></defs>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0969da"/></marker></defs>
<defs><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1a7f37"/></marker></defs>
<defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#59636e"/></marker></defs>
