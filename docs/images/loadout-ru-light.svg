<rect x="530" y="182" width="366" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="544" y="199" font-size="13" fill="#1f2328" font-weight="600">Скиллы</text>
<text x="544" y="215" font-size="11" fill="#59636e">перечислены по описанию, грузятся по запросу</text>
<path d="M488 248 L526 248" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#m-orange)"/>
<rect x="530" y="228" width="366" height="40" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/>
<text x="544" y="245" font-size="13" fill="#1f2328" font-weight="600">MCP-серверы и инструменты</text>
<text x="544" y="261" font-size="11" fill="#59636e">серверы из конфига, схемы — после прогона</text>
<path d="M488 294 L526 294" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#m-yellow)"/>
<rect x="530" y="274" width="366" height="40" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/>
<text x="544" y="291" font-size="13" fill="#1f2328" font-weight="600">Команды</text>
<text x="544" y="307" font-size="11" fill="#59636e">слеш-команды, которые предлагает харнесс</text>
<rect x="24" y="334" width="26" height="16" rx="4" fill="#f6f8fa" stroke="#59636e" stroke-width="1"/>
<text x="60" y="347" font-size="12" fill="#59636e">ctxray предсказывает это по файлам: inspect, L1–L3</text>
<rect x="24" y="358" width="26" height="16" rx="4" fill="none" stroke="#59636e" stroke-width="1" stroke-dasharray="5 4"/>
<text x="60" y="371" font-size="12" fill="#59636e">ctxray видит это, когда запускает харнесс: L4 и выше</text>
<text x="24" y="404" font-size="13" fill="#1f2328" font-weight="600">У каждого куска есть файл, из которого он взялся, причина загрузки и токены.</text>
