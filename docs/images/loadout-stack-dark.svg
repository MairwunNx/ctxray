<svg xmlns="http://www.w3.org/2000/svg" width="920" height="486" viewBox="0 0 920 486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>The Loadout Stack: L1–L7</title>
<text x="56" y="36" font-size="22" font-weight="700" fill="#f0f6fc">The Loadout Stack</text>
<rect x="56" y="64" width="640" height="46" rx="8" fill="#12261e" stroke="#3d444d"/>
<rect x="66" y="75" width="40" height="24" rx="6" fill="#3fb950"/>
<text x="86" y="92" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L1</text>
<text x="118" y="92" font-size="15" font-weight="600" fill="#f0f6fc">Lint</text>
<text x="206" y="92" font-size="13" fill="#9198a1">Rule, skill, and config files are valid</text>
<rect x="56" y="116" width="640" height="46" rx="8" fill="#12261e" stroke="#3d444d"/>
<rect x="66" y="127" width="40" height="24" rx="6" fill="#3fb950"/>
<text x="86" y="144" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L2</text>
<text x="118" y="144" font-size="15" font-weight="600" fill="#f0f6fc">Policy</text>
<text x="206" y="144" font-size="13" fill="#9198a1">The setup follows your organisation's rules</text>
<rect x="56" y="168" width="640" height="46" rx="8" fill="#12261e" stroke="#3d444d"/>
<rect x="66" y="179" width="40" height="24" rx="6" fill="#3fb950"/>
<text x="86" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L3</text>
<text x="118" y="196" font-size="15" font-weight="600" fill="#f0f6fc">Resolve</text>
<text x="206" y="196" font-size="13" fill="#9198a1">The right rules apply to the files you work on</text>
<rect x="56" y="232" width="640" height="46" rx="8" fill="#121d2f" stroke="#3d444d"/>
<rect x="66" y="243" width="40" height="24" rx="6" fill="#4493f8"/>
<text x="86" y="260" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L4</text>
<text x="118" y="260" font-size="15" font-weight="600" fill="#f0f6fc">Assemble</text>
<text x="206" y="260" font-size="13" fill="#9198a1">The agent really sent them to the model</text>
<rect x="56" y="284" width="640" height="46" rx="8" fill="#121d2f" stroke="#3d444d"/>
<rect x="66" y="295" width="40" height="24" rx="6" fill="#4493f8"/>
<text x="86" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L5</text>
<text x="118" y="312" font-size="15" font-weight="600" fill="#f0f6fc">Wire</text>
<text x="206" y="312" font-size="13" fill="#9198a1">Reading a file or calling a skill adds the right rule</text>
<rect x="56" y="348" width="640" height="46" rx="8" fill="#211a33" stroke="#3d444d"/>
<rect x="66" y="359" width="40" height="24" rx="6" fill="#ab7df8"/>
<text x="86" y="376" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L6</text>
<text x="118" y="376" font-size="15" font-weight="600" fill="#f0f6fc">Activate</text>
<text x="206" y="376" font-size="13" fill="#9198a1">The model picks the right skill for a prompt</text>
<rect x="56" y="400" width="640" height="46" rx="8" fill="#211a33" stroke="#3d444d"/>
<rect x="66" y="411" width="40" height="24" rx="6" fill="#ab7df8"/>
<text x="86" y="428" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L7</text>
<text x="118" y="428" font-size="15" font-weight="600" fill="#f0f6fc">Scenario</text>
<text x="206" y="428" font-size="13" fill="#9198a1">The agent gets the task done the right way</text>
<path d="M712 68 h8 V210 h-8" fill="none" stroke="#3fb950" stroke-width="2"/>
<text x="732" y="136.0" font-size="14" font-weight="600" fill="#3fb950">Reads files</text>
<text x="732" y="154.0" font-size="12" fill="#9198a1">no agent, no model</text>
<path d="M712 236 h8 V326 h-8" fill="none" stroke="#4493f8" stroke-width="2"/>
<text x="732" y="278.0" font-size="14" font-weight="600" fill="#4493f8">Launches the agent</text>
<text x="732" y="296.0" font-size="12" fill="#9198a1">with a mock model</text>
<path d="M712 352 h8 V442 h-8" fill="none" stroke="#ab7df8" stroke-width="2"/>
<text x="732" y="394.0" font-size="14" font-weight="600" fill="#ab7df8">Asks a model</text>
<text x="732" y="412.0" font-size="12" fill="#9198a1">real, or its recorded answers</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9198a1"/></marker></defs>
<line x1="28" y1="70" x2="28" y2="438" stroke="#9198a1" stroke-width="2" marker-end="url(#a)"/>
<text x="56" y="470" font-size="12" fill="#9198a1">Top to bottom: from cheap checks for every commit to slower ones that spend model tokens</text>
</svg>
