<svg xmlns="http://www.w3.org/2000/svg" width="920" height="486" viewBox="0 0 920 486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="56" y="36" font-size="22" font-weight="700" fill="#1f2328">The Loadout Stack</text>
<rect x="56" y="64" width="640" height="46" rx="8" fill="#dafbe1" stroke="#d1d9e0"/>
<rect x="66" y="75" width="40" height="24" rx="6" fill="#1a7f37"/>
<text x="86" y="92" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L1</text>
<text x="118" y="92" font-size="15" font-weight="600" fill="#1f2328">Lint</text>
<text x="206" y="92" font-size="13" fill="#59636e">Файлы правил, скиллов и конфигов корректны</text>
<rect x="56" y="116" width="640" height="46" rx="8" fill="#dafbe1" stroke="#d1d9e0"/>
<rect x="66" y="127" width="40" height="24" rx="6" fill="#1a7f37"/>
<text x="86" y="144" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L2</text>
<text x="118" y="144" font-size="15" font-weight="600" fill="#1f2328">Policy</text>
<text x="206" y="144" font-size="13" fill="#59636e">Настройка следует правилам вашей компании</text>
<rect x="56" y="168" width="640" height="46" rx="8" fill="#dafbe1" stroke="#d1d9e0"/>
<rect x="66" y="179" width="40" height="24" rx="6" fill="#1a7f37"/>
<text x="86" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L3</text>
<text x="118" y="196" font-size="15" font-weight="600" fill="#1f2328">Resolve</text>
<text x="206" y="196" font-size="13" fill="#59636e">К файлам, с которыми вы работаете, применяются нужные правила</text>
<rect x="56" y="232" width="640" height="46" rx="8" fill="#ddf4ff" stroke="#d1d9e0"/>
<rect x="66" y="243" width="40" height="24" rx="6" fill="#0969da"/>
<text x="86" y="260" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L4</text>
<text x="118" y="260" font-size="15" font-weight="600" fill="#1f2328">Assemble</text>
<text x="206" y="260" font-size="13" fill="#59636e">Харнесс действительно отправил их модели</text>
<rect x="56" y="284" width="640" height="46" rx="8" fill="#ddf4ff" stroke="#d1d9e0"/>
<rect x="66" y="295" width="40" height="24" rx="6" fill="#0969da"/>
<text x="86" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L5</text>
<text x="118" y="312" font-size="15" font-weight="600" fill="#1f2328">Wire</text>
<text x="206" y="312" font-size="13" fill="#59636e">Чтение файла или вызов скилла добавляет нужное правило</text>
<rect x="56" y="348" width="640" height="46" rx="8" fill="#fbefff" stroke="#d1d9e0"/>
<rect x="66" y="359" width="40" height="24" rx="6" fill="#8250df"/>
<text x="86" y="376" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L6</text>
<text x="118" y="376" font-size="15" font-weight="600" fill="#1f2328">Activate</text>
<text x="206" y="376" font-size="13" fill="#59636e">Модель выбирает нужный скилл под промпт</text>
<rect x="56" y="400" width="640" height="46" rx="8" fill="#fbefff" stroke="#d1d9e0"/>
<rect x="66" y="411" width="40" height="24" rx="6" fill="#8250df"/>
<text x="86" y="428" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">L7</text>
<text x="118" y="428" font-size="15" font-weight="600" fill="#1f2328">Scenario</text>
<text x="206" y="428" font-size="13" fill="#59636e">Агент решает задачу так, как нужно</text>
<path d="M712 68 h8 V210 h-8" fill="none" stroke="#1a7f37" stroke-width="2"/>
<text x="732" y="136.0" font-size="14" font-weight="600" fill="#1a7f37">Читает файлы</text>
<text x="732" y="154.0" font-size="12" fill="#59636e">без харнесса и модели</text>
<path d="M712 236 h8 V326 h-8" fill="none" stroke="#0969da" stroke-width="2"/>
<text x="732" y="278.0" font-size="14" font-weight="600" fill="#0969da">Запускает харнесс</text>
<text x="732" y="296.0" font-size="12" fill="#59636e">с mock-моделью</text>
<path d="M712 352 h8 V442 h-8" fill="none" stroke="#8250df" stroke-width="2"/>
<text x="732" y="394.0" font-size="14" font-weight="600" fill="#8250df">Спрашивает модель</text>
<text x="732" y="412.0" font-size="12" fill="#59636e">настоящую или её записи</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#59636e"/></marker></defs>
<line x1="28" y1="70" x2="28" y2="438" stroke="#59636e" stroke-width="2" marker-end="url(#a)"/>
<text x="56" y="470" font-size="12" fill="#59636e">Сверху вниз: от дешёвых проверок на каждый коммит к долгим, которые тратят токены модели</text>
</svg>
