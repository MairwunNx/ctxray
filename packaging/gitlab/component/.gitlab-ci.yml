# A tag publishes the component's version to the CI/CD Catalog. ctxray's release workflow pushes the tag.
create-release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script: echo "ctxray $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: https://github.com/MairwunNx/ctxray/releases/tag/v$CI_COMMIT_TAG
