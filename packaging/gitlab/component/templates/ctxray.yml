spec:
  inputs:
    stage:
      default: test
      description: The stage the ctxray job runs in
    version:
      default: __VERSION__
      description: The ctxray version, which picks the image
    image:
      default: ghcr.io/mairwunnx/ctxray
      description: The image without its tag, a mirror in your registry for example
    args:
      default: ""
      description: Arguments for `ctxray test`, like `--layer L1-L3`
---
ctxray:
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.image ]]:$[[ inputs.version ]]-runtime
    entrypoint: [""]
  variables:
    # GitLab caches only inside the project's folder.
    CTXRAY_CACHE_DIR: $CI_PROJECT_DIR/.ctxray-cache
  cache:
    key:
      files: [ctxray.lock]
    paths: [.ctxray-cache/]
  script:
    - ctxray test $[[ inputs.args ]]
  artifacts:
    when: always
    paths: [.ctxray/report/]
    reports:
      junit: .ctxray/report/junit.xml
